<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F2439">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اليونيفورم">
<title>نظام إدارة وصرف اليونيفورم</title>
<style>
  :root{
    --navy-900:#0F2439;
    --navy-800:#16324F;
    --navy-700:#20456B;
    --navy-100:#E9EEF4;
    --gold-600:#B4913A;
    --gold-100:#F3EBD6;
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --border:#E1E5EA;
    --text-900:#1B2430;
    --text-600:#5B6774;
    --text-400:#8B97A3;
    --green-700:#256B4A;
    --green-100:#E4F3EC;
    --amber-700:#9A6A17;
    --amber-100:#FBF0D9;
    --red-700:#B03A3A;
    --red-100:#FBEAEA;
    --blue-700:#2A5A8A;
    --blue-100:#E7EFF7;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(15,36,57,.06),0 1px 8px rgba(15,36,57,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
  body{
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
    background:var(--bg);
    color:var(--text-900);
    direction:rtl;
    font-size:14px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  #app{min-height:100vh;min-height:100dvh;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;font-size:14px;touch-action:manipulation;}
  a{color:inherit;}
  /* iOS focuses/zooms in on inputs under 16px — bump on touch-sized screens */
  @media (max-width:640px){
    input,select,textarea{font-size:16px;}
  }

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 500px at 15% 0%, rgba(180,145,58,.10), transparent 60%),
      linear-gradient(160deg,var(--navy-900),var(--navy-800) 55%,var(--navy-700));
    padding:20px;
    padding-top:max(20px, env(safe-area-inset-top));
    padding-bottom:max(20px, env(safe-area-inset-bottom));
  }
  .login-card{
    background:var(--surface);width:100%;max-width:440px;border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04);
    position:relative;
  }
  @media (max-width:480px){
    .login-wrap{padding:0;}
    .login-card{border-radius:0;min-height:100vh;min-height:100dvh;box-shadow:none;display:flex;align-items:center;}
    .login-form{padding:32px 22px;width:100%;}
  }
  .login-form{padding:44px 40px;display:flex;flex-direction:column;justify-content:center;}
  .login-form-brand{
    display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--border);
  }
  .login-form-brand .logo-img{
    height:56px;width:auto;object-fit:contain;flex:none;display:block;
  }
  .brand .logo-img{
    height:40px;width:auto;object-fit:contain;flex:none;display:block;
    background:#fff;border-radius:8px;padding:4px 6px;
  }
  .login-form-brand .brand-text b{display:block;font-size:14.5px;color:var(--navy-900);font-weight:800;line-height:1.35;}
  .login-form-brand .brand-text span{display:block;font-size:11.5px;color:var(--text-600);margin-top:2px;}
  .login-form .eyebrow{color:var(--gold-600);font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:8px;}
  .login-form h2{margin:0 0 6px;font-size:24px;font-weight:800;color:var(--navy-900);}
  .login-form .sub{color:var(--text-600);font-size:13.5px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-600);margin-bottom:7px;font-weight:600;}
  .field input,.field select{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;
    background:#FBFBFC;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field select:focus{border-color:var(--navy-700);background:#fff;box-shadow:0 0 0 3px rgba(22,50,79,.08);}
  /* Icon-wrapped inputs (login / portal forms) */
  .io-field{
    display:flex;align-items:center;gap:8px;width:100%;
    border:1.5px solid var(--border);border-radius:9px;background:#FBFBFC;padding:0 14px;
    transition:border-color .15s, box-shadow .15s;
  }
  .io-field:focus-within{border-color:var(--navy-700);background:#fff;box-shadow:0 0 0 3px rgba(22,50,79,.08);}
  .field .io-field input{
    border:none;background:transparent;padding:12px 0;flex:1;min-width:0;width:auto;
  }
  .field .io-field input:focus{border:none;background:transparent;box-shadow:none;}
  .io-field .io-icon{color:var(--text-400);font-size:15px;flex:none;line-height:1;}
  .io-field .pass-toggle{
    border:none;background:none;color:var(--text-400);font-size:15px;line-height:1;
    padding:8px 2px;cursor:pointer;flex:none;border-radius:6px;
  }
  .io-field .pass-toggle:hover{color:var(--navy-800);}
  .login-secure-note{
    display:flex;align-items:center;gap:6px;justify-content:center;margin-top:22px;
    font-size:11.5px;color:var(--text-400);
  }
  .btn{
    border:none;border-radius:9px;padding:12px 16px;font-weight:700;font-size:13.5px;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:filter .12s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy-800);color:#fff;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-gold{background:var(--gold-600);color:#2b2208;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--navy-800);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--navy-100);}
  .btn-danger{background:var(--red-100);color:var(--red-700);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  @media (max-width:640px){
    .btn{padding:11px 16px;}
    .btn-sm{padding:9px 12px;font-size:12.5px;}
  }
  .err{color:var(--red-700);font-size:12.5px;margin-top:2px;min-height:0;}
  .err:not(:empty){
    background:var(--red-100);border-radius:8px;padding:10px 12px;margin-top:14px;font-weight:600;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .err:not(:empty)::before{content:'⚠';flex:none;font-size:13px;}
  .portal-link{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px;
    padding:12px 14px;border-radius:9px;border:1px solid var(--border);background:#FBFBFC;
    color:var(--navy-800);font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .portal-link:hover{border-color:var(--gold-600);background:var(--gold-100);}
  .link-btn{background:none;border:none;color:var(--navy-700);font-size:12.5px;text-decoration:underline;padding:0;cursor:pointer;}

  /* ---------- Shell ---------- */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;min-height:100dvh;}
  @media (max-width:880px){
    .shell{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;inset:0 0 0 auto;transform:translateX(100%);z-index:40;transition:transform .2s;
      width:230px;max-width:82vw;
      padding-top:max(20px, env(safe-area-inset-top));
      padding-bottom:max(20px, env(safe-area-inset-bottom));
      box-shadow:-8px 0 30px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
  }
  .sidebar-backdrop{
    display:none;
  }
  @media (max-width:880px){
    .sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:30;
    }
  }
  .sidebar{
    background:var(--navy-900);color:#fff;padding:20px 14px;display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px;}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--gold-600);display:flex;align-items:center;justify-content:center;font-weight:800;color:#2b2208;flex:none;}
  .brand div{font-size:13px;font-weight:700;line-height:1.3;}
  .nav-group-label{font-size:10.5px;color:#7E93A8;letter-spacing:.3px;padding:14px 10px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#C9D4E0;
    font-size:13.5px;cursor:pointer;margin-bottom:2px;
  }
  .nav-item .ic{width:18px;text-align:center;flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--gold-600);color:#2b2208;font-weight:700;}
  .sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;}
  .who{font-size:12.5px;color:#C9D4E0;padding:0 10px 8px;}
  .who b{color:#fff;display:block;font-size:13.5px;}

  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;
    padding-top:max(14px, env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    gap:10px;
  }
  .topbar h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .actions{display:flex;align-items:center;gap:10px;flex:none;}
  .bell{position:relative;background:var(--navy-100);border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .bell .dot{position:absolute;top:5px;left:6px;width:8px;height:8px;background:var(--red-700);border-radius:50%;border:2px solid #fff;}
  .menu-toggle{display:none;background:var(--navy-100);border:none;border-radius:8px;width:36px;height:36px;flex:none;font-size:16px;}
  @media (max-width:880px){ .menu-toggle{display:block;} }
  .content{padding:22px 24px;flex:1;}
  @media (max-width:640px){
    .topbar{padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));}
    .topbar h1{font-size:15.5px;}
    .content{padding:14px 12px 28px;}
    .content{padding-bottom:max(28px, env(safe-area-inset-bottom));}
  }

  /* ---------- Cards / grid ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  @media (max-width:480px){
    .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  }
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  @media (max-width:480px){
    .stat-card{padding:12px 14px;}
    .stat-card .value{font-size:19px;}
  }
  .stat-card .label{font-size:12px;color:var(--text-600);margin-bottom:8px;}
  .stat-card .value{font-size:24px;font-weight:800;color:var(--navy-900);}
  .stat-card .value.gold{color:var(--gold-600);}
  .stat-card .value.green{color:var(--green-700);}
  .stat-card .value.red{color:var(--red-700);}
  .stat-card .value.amber{color:var(--amber-700);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;}
  .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .panel-head h3{margin:0;font-size:15px;}
  .panel-body{padding:18px 20px;}
  .panel-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .panel-toolbar input,.panel-toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#FBFBFC;font-size:13px;}
  @media (max-width:640px){
    .panel{border-radius:10px;margin-bottom:14px;}
    .panel-head{padding:13px 14px;}
    .panel-body{padding:14px;}
    .panel-toolbar{width:100%;}
    .panel-toolbar input,.panel-toolbar select{flex:1 1 140px;min-width:0;}
    .panel-head > .btn{width:100%;}
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:var(--text-600);font-weight:700;font-size:11.5px;letter-spacing:.2px;
    padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid #EEF0F2;white-space:nowrap;}
  tbody tr:hover{background:#FAFBFC;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .empty-row{text-align:center;color:var(--text-400);padding:34px 10px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-new{background:var(--blue-100);color:var(--blue-700);}
  .badge-received{background:#EDE7F6;color:#5B3E9A;}
  .badge-progress{background:var(--amber-100);color:var(--amber-700);}
  .badge-done{background:var(--gold-100);color:var(--gold-600);}
  .badge-delivered{background:var(--green-100);color:var(--green-700);}
  .badge-rejected{background:var(--red-100);color:var(--red-700);}
  .badge-eligible{background:var(--green-100);color:var(--green-700);}
  .badge-not-eligible{background:var(--red-100);color:var(--red-700);}

  .icon-btn{background:var(--navy-100);border:none;border-radius:7px;width:30px;height:30px;font-size:13px;}
  .icon-btn:hover{background:var(--navy-700);color:#fff;}
  @media (max-width:640px){
    table{font-size:12.5px;}
    thead th{padding:9px 10px;font-size:11px;}
    tbody td{padding:10px;}
    .icon-btn{width:34px;height:34px;font-size:14px;}
  }

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,20,28,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal.wide{max-width:760px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--text-600);width:30px;height:30px;border-radius:7px;}
  .modal-close:hover{background:var(--navy-100);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;gap:10px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:600px){
    .overlay{
      padding:0;align-items:flex-end;
    }
    .modal{
      max-width:100%;max-height:92dvh;border-radius:16px 16px 0 0;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .modal-head{padding:16px 16px;}
    .modal-body{padding:16px;}
    .modal-foot{padding:14px 16px;flex-direction:column-reverse;}
    .modal-foot .btn{width:100%;}
    .modal-close{width:34px;height:34px;font-size:16px;}
  }

  .info-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .info-line span:first-child{color:var(--text-600);}
  .info-line span:last-child{font-weight:600;}

  .timeline{list-style:none;padding:0;margin:0;}
  .timeline li{display:flex;gap:12px;padding-bottom:18px;position:relative;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline .dot{width:12px;height:12px;border-radius:50%;background:var(--border);margin-top:4px;flex:none;position:relative;z-index:1;}
  .timeline li.done .dot{background:var(--green-700);}
  .timeline .line{position:absolute;top:16px;bottom:-4px;right:5px;width:2px;background:var(--border);}
  .timeline .tl-title{font-weight:700;font-size:13px;}
  .timeline .tl-date{font-size:12px;color:var(--text-600);}

  .alert{padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}
  .alert-red{background:var(--red-100);color:var(--red-700);}
  .alert-amber{background:var(--amber-100);color:var(--amber-700);}
  .alert-green{background:var(--green-100);color:var(--green-700);}
  .alert-blue{background:var(--blue-100);color:var(--blue-700);}

  .tag-pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--navy-100);color:var(--navy-800);font-size:11.5px;font-weight:600;}
  .notif-item{padding:12px 14px;border-bottom:1px solid #EEF0F2;font-size:13px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item .t{font-size:11px;color:var(--text-400);margin-top:3px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--text-400);}
  .empty-state .big{font-size:30px;margin-bottom:10px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .helper{font-size:11.5px;color:var(--text-400);margin-top:4px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
  .toast-wrap{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:220px;}
  @media (max-width:640px){
    .toast-wrap{
      left:12px;right:12px;bottom:max(12px, env(safe-area-inset-bottom));
    }
    .toast{min-width:0;width:100%;}
  }
  .toast.err{background:var(--red-700);}
  .toast.ok{background:var(--green-700);}
  .storage-warn{
    background:#3A1F1F;color:#FFD9D9;padding:10px 18px;font-size:12.5px;text-align:center;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .storage-warn b{color:#fff;}
  .storage-warn-login{
    background:var(--red-100);color:var(--red-700);padding:10px 12px;border-radius:8px;font-size:12px;margin-top:14px;
  }
</style>
</head>
<body>

<script>
/* =========================================================
   STORAGE HELPERS
========================================================= */
async function dbGet(key, fallback){
  try{
    const snap = await dbRef(key).once('value');
    const v = snap.val();
    return (v===null || v===undefined) ? fallback : v;
  }catch(e){ console.error('firebase read error', e); return fallback; }
}
async function dbSet(key, value){
  try{ await dbRef(key).set(value); return true; }
  catch(e){ console.error('firebase write error', e); return null; }
}

/* =========================================================
   CONSTANTS

/* =========================================================
   APP STATE
========================================================= */
let STATE = {
  users:[], employees:[], orders:[], notifications:[], auditLogs:[], branches:[], settings:{price:90, eligibilityDays:365},
  currentUser:null, view:'dashboard', sidebarOpen:false, toasts:[]
};

const KEY_MAP = {employees:'uf-employees', orders:'uf-orders', notifications:'uf-notifications', auditLogs:'uf-audit', users:'uf-users', branches:'uf-branches', settings:'uf-settings'};

/* Attaches a live listener per data type. Firebase fires the callback
   immediately with the current value, then again in real time whenever
   ANY user writes a change — this is what makes HR/tailor/admin see
   each other's updates instantly without refreshing the page. */
function attachRealtimeListeners(){
  return new Promise(resolve=>{
    const pending = new Set(Object.keys(KEY_MAP));
    let resolved = false;
    Object.entries(KEY_MAP).forEach(([stateKey, dbKey])=>{
      dbRef(dbKey).on('value', async (snap)=>{
        let val = snap.val();
        if(val===null || val===undefined){
          if(stateKey==='users'){
            val = [
              {id:uid('u'), username:'admin', password:'admin123', role:'admin', name:'مدير النظام'},
              {id:uid('u'), username:'hr', password:'hr123', role:'hr', name:'سارة العتيبي'},
              {id:uid('u'), username:'tailor', password:'tailor123', role:'tailor', name:'محمد الخياط'},
            ];
            dbRef(dbKey).set(val);
          } else if(stateKey==='branches'){
            val = ['الفرع الرئيسي','فرع جدة','فرع الرياض','فرع الدمام'];
            dbRef(dbKey).set(val);
          } else if(stateKey==='settings'){
            val = {price:90, eligibilityDays:365};
            dbRef(dbKey).set(val);
          } else {
            val = [];
          }
        }
        // Firebase can return arrays as objects with numeric keys once items are removed in the middle — normalize back to arrays for list types.
        if(Array.isArray(STATE[stateKey]) && !Array.isArray(val) && typeof val === 'object'){
          val = Object.values(val);
        }
        STATE[stateKey] = val;
        if(pending.has(stateKey)){
          pending.delete(stateKey);
          if(pending.size===0 && !resolved){ resolved = true; resolve(); }
        } else if(STATE.currentUser && !STATE.modal){
          render();
        }
      });
    });
  });
}

async function persist(key){
  await dbSet(KEY_MAP[key], STATE[key]);
}

function addAudit(action, details){
  STATE.auditLogs.unshift({id:uid('a'), action, details, user: STATE.currentUser? STATE.currentUser.name + ' ('+ROLE_LABEL[STATE.currentUser.role]+')':'—', at: new Date().toISOString()});
  persist('auditLogs');
}
function addNotification(message){
  STATE.notifications.unshift({id:uid('n'), message, at:new Date().toISOString(), read:false});
  persist('notifications');
}
function toast(msg, type){
  const id = uid('t');
  STATE.toasts.push({id, msg, type: type||'ok'});
  render();
  setTimeout(()=>{ STATE.toasts = STATE.toasts.filter(t=>t.id!==id); render(); }, 3200);
}

/* =========================================================
   ELIGIBILITY
========================================================= */
function employeeEligibility(emp){
  if(!emp.nextDueDate) return {eligible:true, daysLeft:0};
  const days = daysBetween(emp.nextDueDate, todayISO());
  return {eligible: days <= 0, daysLeft: Math.max(days,0)};
}

/* =========================================================
   RENDER ROOT
========================================================= */
function render(){
  const root = document.getElementById('app');
  if(!STATE.currentUser){ root.innerHTML = loginView(); bindLogin(); renderToasts(); return; }
  root.innerHTML = shellView();
  bindShell();
  renderToasts();
}

function renderToasts(){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  wrap.innerHTML = STATE.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':'ok'}">${t.msg}</div>`).join('');
}

function bindLogin(){
  document.getElementById('li-submit').onclick = doLogin;
  document.getElementById('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('li-user').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('li-pass').focus(); });
  document.getElementById('li-employee-portal').onclick = (e)=>{ e.preventDefault(); STATE.employeePortal = true; renderEmployeePortal(); };
  const passToggle = document.getElementById('li-pass-toggle');
  const passInput = document.getElementById('li-pass');
  passToggle.onclick = ()=>{
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    passToggle.textContent = showing ? '👁' : '🙈';
    passToggle.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
  };
}
function doLogin(){
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const user = STATE.users.find(x=>x.username===u && x.password===p);
  if(!user){ document.getElementById('li-err').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.'; return; }
  STATE.currentUser = user;
  STATE.view = 'dashboard';
  addAudit('تسجيل دخول', user.name);
  render();
}
function logout(){
  addAudit('تسجيل خروج', STATE.currentUser.name);
  STATE.currentUser = null;
  render();
}

      </div>
      <div class="info-line"><span>الاسم</span><span>${emp.name}</span></div>
      <div class="info-line"><span>نوع اليونيفورم الحالي</span><span>${emp.uniformType||'ثوب'}</span></div>
      <div class="info-line"><span>تاريخ آخر صرف</span><span>${fmtDate(emp.lastIssueDate)}</span></div>

}

function navItems(role){
  const base = [{v:'dashboard', ic:'▦', l:'لوحة التحكم'}];
  if(hasHRAccess(role)) base.push({v:'employees', ic:'👤', l:'الموظفون'});
  base.push({v:'orders', ic:'📋', l:'الطلبات'});
  base.push({v:'notifications', ic:'🔔', l:'الإشعارات'});
  if(role==='admin'){
    base.push({v:'users', ic:'🛠', l:'المستخدمون'});
    base.push({v:'settings', ic:'⚙', l:'الإعدادات'});
    base.push({v:'audit', ic:'🗂', l:'سجل العمليات'});
  }
  return base;
}
function viewTitle(v){
  return {dashboard:'لوحة التحكم', employees:'الموظفون', orders:'الطلبات', notifications:'الإشعارات',
    users:'إدارة المستخدمين', settings:'الإعدادات العامة', audit:'سجل العمليات', employeeDetail:'سجل الموظف'}[v] || '';
}
function initials(name){ return (name||'').trim().split(' ').slice(0,2).map(w=>w[0]).join(''); }

function shellView(){

    ${STATE.sidebarOpen? `<div class="sidebar-backdrop" id="sidebar-backdrop"></div>` : ''}
    <div class="sidebar ${STATE.sidebarOpen?'open':''}">
      <div class="brand">${CAFE_LOGO_SVG}<div>نظام اليونيفورم<br><span style="font-weight:400;color:#8FA3B8;font-size:11px;">إدارة الصرف والمتابعة</span></div></div>
      <div class="nav-group-label">القائمة</div>
      ${items.map(i=>`<div class="nav-item ${STATE.view===i.v?'active':''}" data-nav="${i.v}"><span class="ic">${i.ic}</span>${i.l}</div>`).join('')}
      <div class="sidebar-foot">
        <div class="who"><b>${u.name}</b>${ROLE_LABEL[u.role]}</div>

    </div>
    <div class="main">

        <div style="display:flex;align-items:center;gap:10px;">

          <button class="bell" id="bell-btn">🔔${unread?`<span class="dot"></span>`:''}</button>

  `;
}

function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ STATE.view = el.dataset.nav; STATE.sidebarOpen=false; STATE.detailId=null; render(); };
  });
  const logoutBtn = document.querySelector('[data-action="logout"]');
  if(logoutBtn) logoutBtn.onclick = logout;
  const menuToggle = document.getElementById('menu-toggle');
  if(menuToggle) menuToggle.onclick = ()=>{ STATE.sidebarOpen = !STATE.sidebarOpen; render(); };
  const backdrop = document.getElementById('sidebar-backdrop');

}

/* =========================================================
   VIEW ROUTER
========================================================= */
function viewContent(){
  switch(STATE.view){
    case 'dashboard': return dashboardView();
    case 'employees': return employeesView();
    case 'orders': return ordersView();
    case 'notifications': return notificationsView();
    case 'users': return usersView();
    case 'settings': return settingsView();
    case 'audit': return auditView();
    case 'employeeDetail': return employeeDetailView();
    default: return '';
  }
}
function bindViewHandlers(){
  switch(STATE.view){
    case 'dashboard': bindDashboard(); break;
    case 'employees': bindEmployees(); break;
    case 'orders': bindOrders(); break;
    case 'notifications': bindNotifications(); break;
    case 'users': bindUsers(); break;
    case 'settings': bindSettings(); break;
    case 'employeeDetail': bindEmployeeDetail(); break;
  }
}

/* =========================================================
   DASHBOARD
========================================================= */
function dashboardView(){
  const total = STATE.employees.length;
  const orders = STATE.orders;
  const countByStatus = s => orders.filter(o=>o.status===s).length;
  const eligible = STATE.employees.filter(e=>employeeEligibility(e).eligible).length;
  const notEligible = total - eligible;
  const delivered = countByStatus(STATUS.DELIVERED);
  const price = STATE.settings.price;
  const totalCost = delivered * price;
  const totalOrderValue = orders.length * price;

  const cards = [
    {l:'إجمالي الموظفين', v: total, c:''},
    {l:'طلبات جديدة', v: countByStatus(STATUS.NEW), c:''},
    {l:'قيد التنفيذ', v: countByStatus(STATUS.RECEIVED)+countByStatus(STATUS.PROGRESS), c:'amber'},
    {l:'طلبات منجزة', v: countByStatus(STATUS.DONE), c:'gold'},
    {l:'تم تسليمها', v: delivered, c:'green'},
    {l:'مستحقون لليونيفورم', v: eligible, c:'green'},
    {l:'غير مستحقين حاليًا', v: notEligible, c:'red'},
    {l:'إجمالي تكلفة اليونيفورم', v: totalCost.toLocaleString('ar')+' ريال', c:'gold'},
    {l:'إجمالي قيمة طلبات الخياط', v: totalOrderValue.toLocaleString('ar')+' ريال', c:''},
  ];
  const recent = [...orders].sort((a,b)=> new Date(b.createdDate)-new Date(a.createdDate)).slice(0,6);
  return `
    <div class="stat-grid">
      ${cards.map(c=>`<div class="stat-card"><div class="label">${c.l}</div><div class="value ${c.c}">${c.v}</div></div>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>أحدث الطلبات</h3></div>
      <div class="panel-body table-wrap">
        <table><thead><tr><th>رقم الطلب</th><th>الموظف</th><th>الفرع</th><th>الحالة</th><th>تاريخ الطلب</th></tr></thead>
        <tbody>
          ${recent.length? recent.map(o=>`<tr><td>#${o.code}</td><td>${o.employeeName}</td><td>${o.branch}</td><td><span class="badge ${STATUS_BADGE[o.status]}">${o.status}</span></td><td>${fmtDate(o.createdDate)}</td></tr>`).join('') : `<tr><td colspan="5" class="empty-row">لا توجد طلبات بعد</td></tr>`}
        </tbody></table>
      </div>
    </div>
  `;
}
function bindDashboard(){}

/* =========================================================
   EMPLOYEES
========================================================= */
function employeesView(){
  const role = STATE.currentUser.role;
  const canManage = hasHRAccess(role);
  const q = STATE.empFilters || {search:'', branch:'', status:'', title:''};
  let list = STATE.employees.filter(e=>{
    const s = q.search.trim();
    const matchSearch = !s || e.name.includes(s) || e.employeeNumber.includes(s) || e.nationalId.includes(s);
    const matchBranch = !q.branch || e.branch===q.branch;
    const matchTitle = !q.title || e.jobTitle===q.title;
    const elig = employeeEligibility(e);
    const matchStatus = !q.status || (q.status==='eligible' ? elig.eligible : !elig.eligible);
    return matchSearch && matchBranch && matchTitle && matchStatus;
  });
  const titles = [...new Set(STATE.employees.map(e=>e.jobTitle).filter(Boolean))];

  return `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-toolbar">
          <input id="emp-search" placeholder="بحث بالاسم / الرقم الوظيفي / الهوية" value="${q.search}" style="width:230px;">
          <select id="emp-branch"><option value="">كل الفروع</option>${STATE.branches.map(b=>`<option ${q.branch===b?'selected':''}>${b}</option>`).join('')}</select>
          <select id="emp-title"><option value="">كل المسميات</option>${titles.map(t=>`<option ${q.title===t?'selected':''}>${t}</option>`).join('')}</select>
          <select id="emp-status">
            <option value="">كل حالات الاستحقاق</option>
            <option value="eligible" ${q.status==='eligible'?'selected':''}>مستحق</option>
            <option value="not" ${q.status==='not'?'selected':''}>غير مستحق</option>
          </select>
        </div>
        ${canManage ? `<button class="btn btn-primary btn-sm" id="add-emp-btn">+ إضافة موظف</button>` : ''}
      </div>
      <div class="panel-body table-wrap">
        <table>
          <thead><tr><th>الموظف</th><th>الرقم الوظيفي</th><th>الهوية</th><th>الفرع</th><th>المسمى</th><th>المقاس</th><th>آخر صرف</th><th>الاستحقاق القادم</th><th>الحالة</th><th></th></tr></thead>
          <tbody>
          ${list.length ? list.map(e=>{
            const elig = employeeEligibility(e);
            return `<tr>
              <td><a href="#" data-emp-detail="${e.id}" style="color:var(--navy-800);font-weight:600;text-decoration:none;">${e.name}</a></td>
              <td>${e.employeeNumber}</td><td>${e.nationalId}</td><td>${e.branch}</td><td>${e.jobTitle}</td><td>${e.size}</td>
              <td>${fmtDate(e.lastIssueDate)}</td><td>${fmtDate(e.nextDueDate)}</td>
              <td>${elig.eligible? `<span class="badge badge-eligible">مستحق</span>` : `<span class="badge badge-not-eligible">بعد ${elig.daysLeft} يوم</span>`}</td>
              <td>
                ${canManage ? `<button class="icon-btn" data-edit-emp="${e.id}" title="تعديل">✎</button>` : ''}
                ${canManage && elig.eligible ? `<button class="icon-btn" data-new-order="${e.id}" title="طلب جديد">+</button>` : ''}
              </td>
            </tr>`;
          }).join('') : `<tr><td colspan="10" class="empty-row">لا يوجد موظفون مطابقون</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function bindEmployees(){
  const sEl = document.getElementById('emp-search'), bEl = document.getElementById('emp-branch'),
        tEl = document.getElementById('emp-title'), stEl = document.getElementById('emp-status');
  const upd = ()=>{ STATE.empFilters = {search:sEl.value, branch:bEl.value, title:tEl.value, status:stEl.value}; render(); };
  if(sEl){ sEl.oninput = upd; bEl.onchange=upd; tEl.onchange=upd; stEl.onchange=upd; }
  const addBtn = document.getElementById('add-emp-btn');
  if(addBtn) addBtn.onclick = ()=> openEmployeeModal(null);
  document.querySelectorAll('[data-edit-emp]').forEach(el=> el.onclick = ()=> openEmployeeModal(el.dataset.editEmp));
  document.querySelectorAll('[data-new-order]').forEach(el=> el.onclick = ()=> openOrderModal(el.dataset.newOrder));
  document.querySelectorAll('[data-emp-detail]').forEach(el=> el.onclick = (ev)=>{ ev.preventDefault(); STATE.detailId = el.dataset.empDetail; STATE.view='employeeDetail'; render(); });
}

function openEmployeeModal(empId){
  const emp = empId ? STATE.employees.find(e=>e.id===empId) : null;
  STATE.modal = {type:'employee', emp};
  render();
}

function ordersView(){
  const role = STATE.currentUser.role;
  const canManage = hasHRAccess(role);
  const q = STATE.orderFilters || {search:'', status:''};
  let list = STATE.orders.filter(o=>{
    const s = q.search.trim();

  return `

            ${Object.values(STATUS).map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}
          </select>

        <table>

            <td>${fmtDate(o.createdDate)}</td><td><span class="badge ${STATUS_BADGE[o.status]}">${o.status}</span></td><td>${o.price} ريال</td>

function bindOrders(){
  const sEl = document.getElementById('ord-search'), stEl = document.getElementById('ord-status');

  if(sEl){ sEl.oninput = upd; stEl.onchange = upd; }
  const addBtn = document.getElementById('add-order-btn');
  if(addBtn) addBtn.onclick = ()=> openOrderModal(null);
  document.querySelectorAll('[data-order-detail]').forEach(el=> el.onclick = ()=> openOrderDetailModal(el.dataset.orderDetail));
  document.querySelectorAll('[data-order-edit]').forEach(el=> el.onclick = ()=> openOrderEditModal(el.dataset.orderEdit));
  document.querySelectorAll('[data-order-delete]').forEach(el=> el.onclick = ()=> deleteOrder(el.dataset.orderDelete));
}

function openOrderEditModal(orderId){
  STATE.modal = {type:'orderEdit', order: STATE.orders.find(o=>o.id===orderId)};
  render();
}

function deleteOrder(orderId){
  const o = STATE.orders.find(x=>x.id===orderId);
  if(!o) return;
  if(confirm(`حذف الطلب #${o.code} الخاص بالموظف "${o.employeeName}"؟ لا يمكن التراجع عن هذا الإجراء.`)){
    STATE.orders = STATE.orders.filter(x=>x.id!==orderId);
    persist('orders');
    addAudit('حذف طلب يونيفورم', `#${o.code} — ${o.employeeName}`);
    toast('تم حذف الطلب');
    render();
  }
}

function openOrderModal(preselectEmpId){
  const eligibleList = STATE.employees.filter(e=>employeeEligibility(e).eligible || STATE.currentUser.role==='admin');
  STATE.modal = {type:'order', preselectEmpId, eligibleList};
  render();
}
function openOrderDetailModal(orderId){
  STATE.modal = {type:'orderDetail', order: STATE.orders.find(o=>o.id===orderId)};
  render();
}

    STATE.settings = {price, eligibilityDays: days};
    persist('settings'); addAudit('تعديل الإعدادات', `السعر: ${price} ريال، مدة الاستحقاق: ${days} يوم`);
    toast('تم حفظ الإعدادات'); render();
  };
  document.querySelectorAll('[data-del-branch]').forEach(el=> el.onclick = ()=>{
    STATE.branches = STATE.branches.filter(b=>b!==el.dataset.delBranch);
    persist('branches'); render();
  });
  document.getElementById('add-branch-btn').onclick = ()=>{
    const v = document.getElementById('new-branch').value.trim();
    if(!v) return;
    if(!STATE.branches.includes(v)) STATE.branches.push(v);
    persist('branches'); render();
  };
}

function bindOrderModal(){
  const empSel = document.getElementById('o-emp');
  const infoBox = document.getElementById('o-emp-info');
  const eligBox = document.getElementById('o-eligibility');
  const overrideCk = document.getElementById('o-override');
  const reasonWrap = document.getElementById('o-reason-wrap');

  function refreshEmp(){
    const emp = STATE.employees.find(e=>e.id===empSel.value);
    if(!emp){ infoBox.innerHTML=''; eligBox.innerHTML=''; return; }
    infoBox.innerHTML = `
      <div class="grid-2" style="margin:4px 0 10px;">
        <div class="info-line"><span>الفرع</span><span>${emp.branch}</span></div>
        <div class="info-line"><span>المسمى الوظيفي</span><span>${emp.jobTitle}</span></div>
        <div class="info-line"><span>المقاس</span><span>${emp.size}</span></div>
        <div class="info-line"><span>رقم الهوية</span><span>${emp.nationalId}</span></div>
      </div>`;
    const elig = employeeEligibility(emp);
    if(elig.eligible){
      eligBox.innerHTML = `<div class="alert alert-green">الموظف مستحق لصرف يونيفورم جديد.</div>`;
    } else {
      eligBox.innerHTML = `<div class="alert alert-red">لا يمكن إنشاء طلب يونيفورم جديد لهذا الموظف. الموظف استلم آخر يونيفورم بتاريخ ${fmtDate(emp.lastIssueDate)}، والاستحقاق القادم بتاريخ ${fmtDate(emp.nextDueDate)} (بعد ${elig.daysLeft} يوم).</div>`;
    }
  }
  empSel.onchange = refreshEmp;
  refreshEmp();

  if(overrideCk){
    overrideCk.onchange = ()=>{ reasonWrap.style.display = overrideCk.checked? 'block':'none'; };
  }

  document.getElementById('save-order').onclick = ()=>{
    const emp = STATE.employees.find(e=>e.id===empSel.value);
    if(!emp){ toast('الرجاء اختيار موظف','err'); return; }
    const elig = employeeEligibility(emp);
    const isAdmin = STATE.currentUser.role==='admin';
    let exceptionReason = null;
    if(!elig.eligible){
      if(isAdmin && overrideCk && overrideCk.checked){
        exceptionReason = document.getElementById('o-reason').value.trim();
        if(!exceptionReason){ toast('يجب تسجيل سبب الاستثناء','err'); return; }
      } else {
        toast('الموظف غير مستحق لصرف يونيفورم جديد حالياً','err'); return;
      }
    }
    if(STATE.orders.some(o=>o.employeeId===emp.id && ![STATUS.DELIVERED, STATUS.REJECTED].includes(o.status))){
      toast('يوجد طلب قائم بالفعل لهذا الموظف','err'); return;
    }
    const order = {
      id:uid('o'), code: String(1000+STATE.orders.length+1),
      employeeId: emp.id, employeeName: emp.name, employeeNumber: emp.employeeNumber, branch: emp.branch, size: emp.size,
      uniformType:'ثوب', price: STATE.settings.price, status: STATUS.NEW,
      createdDate: todayISO(), receivedDate:null, progressDate:null, completedDate:null, deliveredDate:null,
      requestedBy: STATE.currentUser.name, exceptionReason
    };
    STATE.orders.push(order);
    persist('orders');
    addAudit('إنشاء طلب يونيفورم', `${emp.name} — طلب #${order.code}` + (exceptionReason? ` (استثناء: ${exceptionReason})`:''));
    addNotification(`تم إرسال طلب يونيفورم جديد إلى الخياط — الموظف ${emp.name} (#${order.code}).`);
    toast('تم إرسال الطلب إلى الخياط');
    closeModal();
  };
  document.getElementById('cancel-order').onclick = closeModal;
}

      </div>

        <button class="btn btn-primary" id="save-order-edit">حفظ التعديلات</button>

function bindOrderEditModal(o){
  document.getElementById('save-order-edit').onclick = ()=>{
    const type = val('oe-type');
    const size = document.getElementById('oe-size').value;
    const price = Number(document.getElementById('oe-price').value);
    const status = document.getElementById('oe-status').value;
    if(!type){ toast('الرجاء تعبئة نوع اليونيفورم','err'); return; }
    if(!price || price<=0){ toast('السعر يجب أن يكون أكبر من صفر','err'); return; }
    const oldStatus = o.status;
    Object.assign(o, {uniformType:type, size, price, status});
    if(status!==oldStatus){
      const today = todayISO();
      if(status===STATUS.DELIVERED && !o.deliveredDate){
        o.deliveredDate = today;
        const emp = STATE.employees.find(e=>e.id===o.employeeId);
        if(emp){ emp.lastIssueDate = today; emp.nextDueDate = addDays(today, STATE.settings.eligibilityDays); persist('employees'); }
      }
      if(status===STATUS.DONE && !o.completedDate) o.completedDate = today;
      if(status===STATUS.RECEIVED && !o.receivedDate) o.receivedDate = today;
      if(status===STATUS.PROGRESS && !o.progressDate) o.progressDate = today;
    }
    persist('orders');
    addAudit('تعديل طلب يونيفورم', `#${o.code} — ${o.employeeName}` + (status!==oldStatus? ` (الحالة: ${oldStatus} ← ${status})`:''));
    toast('تم حفظ تعديلات الطلب');
    closeModal();
  };
  document.getElementById('cancel-order-edit').onclick = closeModal;
}

/* ---- Order detail modal ---- */
function orderDetailModal(o){
  const role = STATE.currentUser.role;
  const steps = [
    {key:STATUS.NEW, label:'تم إنشاء الطلب', date:o.createdDate},
    {key:STATUS.RECEIVED, label:'استلام الخياط للطلب', date:o.receivedDate},
    {key:STATUS.PROGRESS, label:'قيد التنفيذ', date:o.progressDate},
    {key:STATUS.DONE, label:'تم الإنجاز', date:o.completedDate},
    {key:STATUS.DELIVERED, label:'تم التسليم للموظف', date:o.deliveredDate},
  ];
  const order = ['created', STATUS.NEW, STATUS.RECEIVED, STATUS.PROGRESS, STATUS.DONE, STATUS.DELIVERED];
  const curIdx = order.indexOf(o.status);

  let tailorActions = '';
  if(role==='tailor' || role==='admin'){
    if(o.status===STATUS.NEW) tailorActions = `<button class="btn btn-gold btn-sm" data-set-status="${STATUS.RECEIVED}">تم استلام الطلب</button>`;
    else if(o.status===STATUS.RECEIVED) tailorActions = `<button class="btn btn-gold btn-sm" data-set-status="${STATUS.PROGRESS}">بدء التنفيذ</button>`;
    else if(o.status===STATUS.PROGRESS) tailorActions = `<button class="btn btn-gold btn-sm" data-set-status="${STATUS.DONE}">تم الإنجاز</button>`;
    if([STATUS.NEW,STATUS.RECEIVED,STATUS.PROGRESS].includes(o.status)) tailorActions += ` <button class="btn btn-danger btn-sm" data-set-status="${STATUS.REJECTED}">طلب تعديل / رفض</button>`;
  }
  let hrActions = '';
  if(hasHRAccess(role) && o.status===STATUS.DONE){
    hrActions = `<button class="btn btn-primary btn-sm" data-set-status="${STATUS.DELIVERED}">تسجيل تسليم اليونيفورم للموظف</button>`;
  }

  return `
  <div class="overlay" id="modal-overlay">
    <div class="modal wide">
      <div class="modal-head"><h3>تفاصيل الطلب #${o.code}</h3><button class="modal-close" id="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="grid-2" style="margin-bottom:18px;">
          <div class="info-line"><span>الموظف</span><span>${o.employeeName}</span></div>
          <div class="info-line"><span>الرقم الوظيفي</span><span>${o.employeeNumber}</span></div>
          <div class="info-line"><span>الفرع</span><span>${o.branch}</span></div>
          <div class="info-line"><span>المقاس</span><span>${o.size}</span></div>
          <div class="info-line"><span>نوع اليونيفورم</span><span>${o.uniformType}</span></div>
          <div class="info-line"><span>السعر</span><span>${o.price} ريال</span></div>
        </div>
        ${o.exceptionReason? `<div class="alert alert-amber">تم إنشاء هذا الطلب باستثناء إداري — السبب: ${o.exceptionReason}</div>`:''}
        ${o.status===STATUS.REJECTED? `<div class="alert alert-red">هذا الطلب مرفوض / يحتاج تعديل.</div>`:''}
        <h4 style="margin:18px 0 10px;font-size:13.5px;">مسار الطلب</h4>
        <ul class="timeline">
          ${steps.map((s,i)=>`
            <li class="${o.status!==STATUS.REJECTED && curIdx>=order.indexOf(s.key) ? 'done':''}">
              ${i<steps.length-1?'<div class="line"></div>':''}
              <div class="dot"></div>
              <div><div class="tl-title">${s.label}</div><div class="tl-date">${s.date? fmtDate(s.date): 'لم يحدث بعد'}</div></div>
            </li>`).join('')}
        </ul>
      </div>
      <div class="modal-foot" style="flex-wrap:wrap;">
        ${tailorActions}${hrActions}
        <button class="btn btn-ghost" id="close-order-detail" style="margin-inline-start:auto;">إغلاق</button>
      </div>
    </div>
  </div>`;
}
function bindOrderDetailModal(o){
  document.querySelectorAll('[data-set-status]').forEach(btn=>{
    btn.onclick = ()=>{
      const newStatus = btn.dataset.setStatus;
      if(newStatus===STATUS.DELIVERED && o.status!==STATUS.DONE){ toast('لا يمكن تسجيل التسليم قبل إنجاز الطلب','err'); return; }
      o.status = newStatus;
      const today = todayISO();
      if(newStatus===STATUS.RECEIVED) o.receivedDate = today;
      if(newStatus===STATUS.PROGRESS) o.progressDate = today;
      if(newStatus===STATUS.DONE){
        o.completedDate = today;
        addNotification(`تم إنجاز طلب يونيفورم الموظف ${o.employeeName}، والطلب جاهز للتسليم (#${o.code}).`);
      }
      if(newStatus===STATUS.DELIVERED){
        o.deliveredDate = today;
        const emp = STATE.employees.find(e=>e.id===o.employeeId);
        if(emp){
          emp.lastIssueDate = today;
          emp.nextDueDate = addDays(today, STATE.settings.eligibilityDays);
          persist('employees');
        }
        addNotification(`تم تسجيل تسليم اليونيفورم للموظف ${o.employeeName} بتاريخ ${fmtDate(today)}.`);
      }
      if(newStatus===STATUS.REJECTED){
        addNotification(`تم تحديد طلب الموظف ${o.employeeName} كمرفوض / يحتاج تعديل (#${o.code}).`);
      }
      persist('orders');
      addAudit('تغيير حالة طلب', `#${o.code} — ${o.employeeName} → ${newStatus}`);
      toast('تم تحديث حالة الطلب');
      closeModal();
    };
  });
  document.getElementById('close-order-detail').onclick = closeModal;
}

    if(!name||!username){ toast('الرجاء تعبئة الاسم واسم المستخدم','err'); return; }
    if(!editUser && !password){ toast('الرجاء إدخال كلمة مرور','err'); return; }
    const usernameTaken = STATE.users.some(u=>u.username===username && (!editUser || u.id!==editUser.id));
    if(usernameTaken){ toast('اسم المستخدم مستخدم مسبقاً','err'); return; }
    if(editUser){
      editUser.name = name;
      editUser.username = username;
      editUser.role = role;
      if(password) editUser.password = password;
      if(STATE.currentUser.id===editUser.id) STATE.currentUser = editUser;
      persist('users'); addAudit('تعديل مستخدم', `${name} (${ROLE_LABEL[role]})`);
      toast('تم حفظ التعديلات');
    } else {
      STATE.users.push({id:uid('u'), name, username, password, role});
      persist('users'); addAudit('إضافة مستخدم', `${name} (${ROLE_LABEL[role]})`);
      toast('تمت إضافة المستخدم');
    }
    closeModal();
  };
  document.getElementById('cancel-user').onclick = closeModal;
}

/* ---- generic modal bind ---- */
function bindModal(){
  if(!STATE.modal) return;
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.onclick = closeModal;
  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });

  if(STATE.modal.type==='employee') bindEmployeeModal(STATE.modal.emp);
  if(STATE.modal.type==='order') bindOrderModal();
  if(STATE.modal.type==='orderEdit') bindOrderEditModal(STATE.modal.order);
  if(STATE.modal.type==='orderDetail') bindOrderDetailModal(STATE.modal.order);
  if(STATE.modal.type==='user') bindUserModal(STATE.modal.editUser);
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8B97A3;">جارِ الاتصال بقاعدة البيانات...</div>`;
  await attachRealtimeListeners();
  render();
})();
</script>
